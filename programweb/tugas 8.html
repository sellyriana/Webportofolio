<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pendaftaran Mahasiswa</title>
</head>
<body>

    <h1>Website Pendaftaran Mahasiswa</h1>

    <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Profil</a></li>
        <li><a href="#">Pendaftaran</a></li>
    </ul>

    <h2>Form Pendaftaran</h2>

    <form>

        <label for="nama">Nama :</label>
        <input type="text" id="nama" name="nama" placeholder="masukan nama anda">
        <br>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="masukan email anda">
        <br>

        <label for="password">Password :</label>
        <input type="password" id="password" name="password" placeholder="masukan pass anda">
        <br>

        <label for="tanggal">Tanggal Lahir :</label>
        <input type="date" id="tanggal" name="tanggal">
        <br>

        <label for="umur">Umur :</label>
        <input type="number" id="umur" name="umur">
        <br>

        <label for="upload">Upload :</label>
        <input type="file" id="upload" name="upload">
        <br>

        <label>Gender :</label>
        <input type="radio" id="perempuan" name="gender" value="Perempuan">
        <label for="perempuan">Perempuan</label>

        <input type="radio" id="laki" name="gender" value="Laki-laki">
        <label for="laki">Laki-laki</label>
        <br>

        <label for="hobi">Hobi :</label>
        <select id="hobi" name="hobi">
            <option value="">---HOBI---</option>
            <option value="Membaca">Membaca</option>
            <option value="Menulis">Menulis</option>
            <option value="Olahraga">Olahraga</option>
            <option value="Musik">Musik</option>
        </select>
        <br>

        <label for="alamat">Alamat :</label>
        <textarea id="alamat" name="alamat" rows="5" cols="60" placeholder="masukan alamat"></textarea>
        <br>

        <button type="submit">Simpan</button>

    </form>

    <br>

    <footer>
        © 2026 Website Pendaftaran
    </footer>

</body>
</html>
